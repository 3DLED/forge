# Builds the app and publishes it to GitHub Pages.
#
# Building here rather than committing `dist/` keeps generated output out of the repo and
# means a phone gets the new version from a plain `git push` — no local build step, and no
# chance of shipping a stale bundle someone forgot to rebuild.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, rebuild/v2]
  workflow_dispatch:

# Allow the workflow to publish Pages, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The licensed seed data is committed encrypted, because the repo is public and the
      # ExerciseDB licence forbids publishing the raw materials. Without this the build
      # cannot resolve src/data/seed/catalogue.ts and fails at the typecheck.
      - run: npm run seed:unlock
        env:
          FORGE_SEED_KEY: ${{ secrets.FORGE_SEED_KEY }}

      # Typechecks as part of the build script, so a type error fails the deploy
      # rather than shipping.
      - run: npm run build

      # The pictures are unlocked for the native builds, which have to carry them: a Capacitor
      # app serves from the device and cannot fetch one later. Pages is the opposite case. It is
      # a public website, the filenames are the ExerciseDB ids in sequence, and anybody who
      # notices that can walk the whole set — which is the "endpoint allowing bulk download"
      # clause 13 is about. So they are dropped before the artifact is uploaded, and the web
      # build lays out around a missing picture the way it already does for a custom movement.
      #
      # This is a licence decision rather than a technical one. If it is ever judged that
      # serving them inside the app is covered by clause 9 the same way displaying them is,
      # delete this step and they ship.
      - run: rm -rf dist/exercise-media

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
