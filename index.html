<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Forge — Hybrid Training</title>
<meta name="description" content="Plan and track running, lifting, calisthenics, and Spartan/OCR training in one place.">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="brand-mark"><path d="M4 8h3v8H4zM17 8h3v8h-3zM7 10.5h10v3H7z" fill="currentColor"/></svg>
      <span>Forge</span>
    </div>
    <div class="appbar-actions">
      <span id="race-countdown" class="countdown" hidden></span>
      <button id="btn-theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Main">
  <a href="#/today"    data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 9v12h6v-7h6v7h6V9z" fill="currentColor"/></svg><span>Today</span></a>
  <a href="#/plan"     data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H4v18h16V4h-3V2h-2v2H9V2zm-1 8h12v10H6z" fill="currentColor"/></svg><span>Plan</span></a>
  <a href="#/history"  data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 0 8.9 10.5l-2-.3A7 7 0 1 1 13 5v4l5-4.5L13 0z" fill="currentColor"/></svg><span>History</span></a>
  <a href="#/progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16v2H2V2h2zM7 16H5v-5h2zm4 0H9V7h2zm4 0h-2v-8h2zm4 0h-2V4h2z" fill="currentColor"/></svg><span>Progress</span></a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4zm9 4a9 9 0 0 1-.1 1.3l2 1.6-2 3.4-2.4-1a9 9 0 0 1-2.2 1.3L16 21H8l-.3-2.4a9 9 0 0 1-2.2-1.3l-2.4 1-2-3.4 2-1.6a9.4 9.4 0 0 1 0-2.6l-2-1.6 2-3.4 2.4 1a9 9 0 0 1 2.2-1.3L8 3h8l.3 2.4a9 9 0 0 1 2.2 1.3l2.4-1 2 3.4-2 1.6A9 9 0 0 1 21 12z" fill="currentColor"/></svg><span>More</span></a>
</nav>

<div id="sheet-host"></div>
<div id="toast-host" class="toast-host" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
